<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Funny : sorties entre membres</title>
    <meta
      name="description"
      content="Funny : trouvez des sorties près de chez vous et rejoignez d'autres membres."
    />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f5f9" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Mode d'affichage choisi (Lumineux par défaut), appliqué avant l'affichage pour éviter un flash.
      try {
        if (localStorage.getItem('funny-display-mode') === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#080d18');
        }
      } catch (e) {}
    </script>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script src="runtime-config.js"></script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
