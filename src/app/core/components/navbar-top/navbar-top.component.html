<nav class="navbar-top">

  <!-- Menu burger -->
  <div class="menu-wrap">
    <div class="menu-btn" (click)="toggleMenu()">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <!-- Menu déroulant ancré sous le burger -->
    <div class="dropdown-menu" *ngIf="menuOpen">
      <div class="menu-item" (click)="logout()">🚪 Déconnexion</div>
    </div>
  </div>

  <!-- Logo / Nom de l'app -->
  <div class="app-name">Funny</div>

  <!-- Badge abonnement + Avatar -->
  <div class="right-section">
    <!-- Badge premium -->
    <div
      class="subscription-badge"
      [class.premium]="isPremium"
      [class.not-premium]="!isPremium"
      (click)="goToPremium()"
      [title]="isPremium ? 'Abonné Premium' : 'Passer Premium'"
    >
      <span class="badge-icon">{{ isPremium ? '⭐' : '🔓' }}</span>
      <span class="badge-label" *ngIf="isPremium && subscriptionLabel">{{ subscriptionLabel }}</span>
      <span class="badge-label" *ngIf="!isPremium">Non abonné</span>
    </div>

    <!-- Avatar -->
    <div class="profile-btn" (click)="goToProfile()">
      <img
        *ngIf="avatarUrl; else defaultAvatar"
        [src]="avatarUrl"
        alt="Avatar"
        class="avatar"
      />
      <ng-template #defaultAvatar>
        <div class="avatar-placeholder">👤</div>
      </ng-template>
    </div>
  </div>


</nav>
