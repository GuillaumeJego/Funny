<nav class="navbar-top">
  <!-- Logo / Nom de l'app -->
  <div class="app-name">Funny</div>

  <!-- Badge abonnement + Avatar -->
  <div class="right-section">
    <!-- Badge premium -->
    <div
      appClickable
      class="subscription-badge"
      [class.premium]="isPremium()"
      [class.not-premium]="!isPremium()"
      (click)="goToPremium()"
      [title]="isPremium() ? 'Abonné Premium' : 'Passer Premium'"
    >
      <span class="badge-icon">{{ isPremium() ? '⭐' : '🔓' }}</span>
      @if (isPremium() && subscriptionLabel()) {
        <span class="badge-label">{{ subscriptionLabel() }}</span>
      }
      @if (!isPremium()) {
        <span class="badge-label">Non abonné</span>
      }
    </div>

    <!-- Avatar : ouvre le menu du compte (profil, Premium, déconnexion) -->
    <div class="menu-wrap">
      <button
        type="button"
        class="profile-btn"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen()"
        aria-haspopup="menu"
        title="Mon compte"
      >
        @if (avatarUrl()) {
          <img [src]="avatarUrl()" alt="Mon compte" class="avatar" />
        } @else {
          <div class="avatar-placeholder">👤</div>
        }
      </button>

      @if (menuOpen()) {
        <div class="dropdown-menu" role="menu">
          <button type="button" role="menuitem" class="menu-item" (click)="goToMyProfile()">
            👤 Voir mon profil
          </button>
          <button type="button" role="menuitem" class="menu-item" (click)="goToProfile()">
            ✏️ Modifier mon profil
          </button>
          <button type="button" role="menuitem" class="menu-item" (click)="goToPremium()">
            ⭐ Premium
          </button>
          <div class="menu-separator"></div>
          <button type="button" role="menuitem" class="menu-item logout" (click)="logout()">
            🚪 Se déconnecter
          </button>
        </div>
      }
    </div>
  </div>
</nav>
