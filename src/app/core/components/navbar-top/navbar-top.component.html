<nav class="navbar-top">
  <!-- Logo : ramène aux sorties -->
  <button type="button" class="app-name" (click)="goTo('/dashboard')" aria-label="Funny, accueil">
    funny<b aria-hidden="true">✦</b>
  </button>

  <!-- Badge abonnement + Avatar -->
  <div class="right-section">
    <!-- Badge premium -->
    <div
      appClickable
      class="subscription-badge"
      [class.premium]="isPremium()"
      [class.not-premium]="!isPremium()"
      (click)="goToPremium()"
      [title]="isPremium() ? 'Abonné Premium' : 'Passer Premium'"
    >
      <span class="badge-icon">{{ isPremium() ? '⭐' : '🔓' }}</span>
      @if (isPremium() && subscriptionLabel()) {
        <span class="badge-label">{{ subscriptionLabel() }}</span>
      }
      @if (!isPremium()) {
        <span class="badge-label">Non abonné</span>
      }
    </div>

    <!-- Cloche des notifications -->
    <button
      type="button"
      class="bell-btn"
      [class.active]="onNotifications()"
      (click)="openNotifications()"
      [attr.aria-label]="
        unreadCount() > 0 ? 'Notifications, ' + unreadCount() + ' non lues' : 'Notifications'
      "
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z" />
        <path d="M10 20.5a2.2 2.2 0 0 0 4 0" />
      </svg>
      @if (unreadCount() > 0) {
        <span class="notif-badge">{{ unreadCount() > 99 ? '99+' : unreadCount() }}</span>
      }
    </button>

    <!-- Avatar : ouvre le menu du compte (profil, Premium, déconnexion) -->
    <div class="menu-wrap">
      <button
        type="button"
        class="profile-btn"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen()"
        aria-haspopup="menu"
        title="Mon compte"
      >
        @if (avatarUrl()) {
          <img [src]="avatarUrl()" alt="Mon compte" class="avatar" />
        } @else {
          <div class="avatar-placeholder">👤</div>
        }
      </button>

      @if (menuOpen()) {
        <div class="dropdown-menu" role="menu">
          <button type="button" role="menuitem" class="menu-item" (click)="goToMyProfile()">
            👤 Voir mon profil
          </button>
          <button type="button" role="menuitem" class="menu-item" (click)="goToProfile()">
            ✏️ Modifier mon profil
          </button>
          <button type="button" role="menuitem" class="menu-item" (click)="goToPremium()">
            ⭐ Premium
          </button>
          <button type="button" role="menuitem" class="menu-item" (click)="goTo('/amis')">
            🤝 Mes amis
          </button>
          @if (isAdmin()) {
            <button type="button" role="menuitem" class="menu-item" (click)="goTo('/admin')">
              🛡️ Administration
            </button>
          }
          <div class="menu-separator"></div>
          <button type="button" role="menuitem" class="menu-item logout" (click)="logout()">
            🚪 Se déconnecter
          </button>
        </div>
      }
    </div>
  </div>
</nav>
