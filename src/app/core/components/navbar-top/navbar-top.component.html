<nav class="navbar-top">
  <!-- Menu burger -->
  <div class="menu-wrap">
    <div class="menu-btn" (click)="toggleMenu()">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <!-- Menu déroulant ancré sous le burger -->
    @if (menuOpen) {
      <div class="dropdown-menu">
        <div class="menu-item" (click)="logout()">🚪 Déconnexion</div>
      </div>
    }
  </div>

  <!-- Logo / Nom de l'app -->
  <div class="app-name">Funny</div>

  <!-- Badge abonnement + Avatar -->
  <div class="right-section">
    <!-- Badge premium -->
    <div
      class="subscription-badge"
      [class.premium]="isPremium"
      [class.not-premium]="!isPremium"
      (click)="goToPremium()"
      [title]="isPremium ? 'Abonné Premium' : 'Passer Premium'"
    >
      <span class="badge-icon">{{ isPremium ? '⭐' : '🔓' }}</span>
      @if (isPremium && subscriptionLabel) {
        <span class="badge-label">{{ subscriptionLabel }}</span>
      }
      @if (!isPremium) {
        <span class="badge-label">Non abonné</span>
      }
    </div>

    <!-- Avatar -->
    <div class="profile-btn" (click)="goToProfile()">
      @if (avatarUrl) {
        <img [src]="avatarUrl" alt="Avatar" class="avatar" />
      } @else {
        <div class="avatar-placeholder">👤</div>
      }
    </div>
  </div>
</nav>
