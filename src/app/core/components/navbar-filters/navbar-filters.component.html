<nav class="navbar-filters">

  <div class="filter-item" (click)="toggleAllFilters()">
    <span class="filter-icon">🍽️</span>

  </div>

  <div class="filter-item" (click)="toggleAllFilters()">
    <span class="filter-icon">📍</span>

  </div>

  <div class="filter-item" (click)="toggleAllFilters()">
    <span class="filter-icon">📅</span>

  </div>

  <div class="filter-item" (click)="toggleAllFilters()">
    <span class="filter-icon">💰</span>
    <span class="filter-label">Prix</span>
  </div>

  <div class="filter-item" [class.active]="filters.premium" (click)="togglePremium()">
