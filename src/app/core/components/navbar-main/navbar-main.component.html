<nav class="navbar-main" aria-label="Navigation principale">
  @for (item of navItems; track item.key) {
    <button
      type="button"
      class="nav-item"
      [class.create]="item.key === 'creer'"
      [class.active]="isActive(item)"
      [attr.aria-current]="isActive(item) ? 'page' : null"
      (click)="navigate(item.route)"
    >
      <span class="nav-icon-wrap">
        @switch (item.key) {
          @case ('sorties') {
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" />
            </svg>
          }
          @case ('membres') {
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="9" cy="8" r="3.5" />
              <path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5" />
              <circle cx="17" cy="9" r="2.6" />
              <path d="M16.5 14.6c2.6.1 4.4 1.7 5 4.4" />
            </svg>
            @if (pendingFriendsCount() > 0) {
              <span class="notif-badge">{{ pendingFriendsCount() }}</span>
            }
          }
          @case ('creer') {
            <span class="plus" aria-hidden="true">+</span>
          }
          @case ('mes-sorties') {
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M12 20.5s-8-4.6-8-10.4A4.4 4.4 0 0 1 12 7.6a4.4 4.4 0 0 1 8 2.5c0 5.8-8 10.4-8 10.4z"
              />
            </svg>
          }
          @case ('messages') {
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="5" width="18" height="14" rx="3" />
              <path d="m4 7 8 6 8-6" />
            </svg>
            @if (unreadMessagesCount() > 0) {
              <span class="notif-badge">{{
                unreadMessagesCount() > 99 ? '99+' : unreadMessagesCount()
              }}</span>
            }
          }
        }
      </span>
      <span class="nav-label">{{ item.label }}</span>
    </button>
  }
</nav>

<!-- Notification arrivée pendant la visite -->
@if (toast(); as n) {
  <button type="button" class="notif-toast" role="status" (click)="openToast()">
    <span class="toast-icon">🔔</span>
    <span class="toast-text">
      <strong>{{ n.title }}</strong>
      <span>{{ n.message }}</span>
    </span>
  </button>
}
