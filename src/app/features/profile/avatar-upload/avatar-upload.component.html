<div class="avatar-upload">
  <!-- Affichage avatar actuel -->
  <div class="current-avatar">
    @if (currentAvatarUrl) {
      <img [src]="currentAvatarUrl" alt="Avatar" class="avatar-img" />
    } @else {
      <div class="avatar-placeholder">👤</div>
    }

    <label class="btn-change" for="avatarInput"> 📷 Changer la photo </label>
    <input
      #fileInput
      id="avatarInput"
      type="file"
      accept="image/*"
      (change)="onFileSelected($event)"
      hidden
    />
  </div>

  <!-- Éditeur de recadrage -->
  @if (showCropper) {
    <div class="cropper-container">
      <h3>Recadrer votre photo</h3>
      <image-cropper
        [imageChangedEvent]="imageChangedEvent"
        [maintainAspectRatio]="true"
        [aspectRatio]="1"
        [resizeToWidth]="400"
        [resizeToHeight]="400"
        format="jpeg"
        output="base64"
        (imageCropped)="imageCropped($event)"
      />
      <!-- Prévisualisation avec filtre -->
      @if (croppedImageUrl) {
        <div class="preview-section">
          <h4>Prévisualisation</h4>
          <img
            [src]="croppedImageUrl"
            [style.filter]="selectedFilter"
            class="preview-img"
            alt="Prévisualisation"
          />
          <!-- Filtres -->
          <h4>Filtres</h4>
          <div class="filters">
            @for (filter of filters; track filter) {
              <div
                class="filter-option"
                [class.active]="selectedFilter === filter.value"
                (click)="selectFilter(filter.value)"
              >
                <img
                  [src]="croppedImageUrl"
                  [style.filter]="filter.value"
                  class="filter-thumb"
                  alt="{{ filter.name }}"
                />
                <span>{{ filter.name }}</span>
              </div>
            }
          </div>
        </div>
      }
      <!-- Messages -->
      @if (errorMessage) {
        <div class="error">{{ errorMessage }}</div>
      }
      <!-- Boutons -->
      <div class="actions">
        <button class="btn-secondary" (click)="cancel()">Annuler</button>
        <button class="btn-primary" (click)="onUpload()" [disabled]="uploading || !croppedImageUrl">
          {{ uploading ? 'Upload...' : 'Valider la photo' }}
        </button>
      </div>
    </div>
  }
</div>
