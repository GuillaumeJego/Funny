<div class="register-container">
  <div class="register-card">
    <h1>Inscription</h1>

    <div class="form-group">
      <label for="username">Pseudo</label>
      <input
        id="username"
        type="text"
        [(ngModel)]="username"
        placeholder="3 à 40 lettres ou chiffres"
        autocomplete="username"
      />
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input id="email" type="email" [(ngModel)]="email" placeholder="votre@email.com" />
    </div>

    <div class="form-group">
      <label for="password">Mot de passe</label>
      <input id="password" type="password" [(ngModel)]="password" placeholder="••••••••" />
    </div>

    <div class="form-group">
      <label for="confirmPassword">Confirmer le mot de passe</label>
      <input
        id="confirmPassword"
        type="password"
        [(ngModel)]="confirmPassword"
        placeholder="••••••••"
      />
    </div>

    <label class="consent">
      <input type="checkbox" [(ngModel)]="adult" />
      <span>J'ai 18 ans ou plus.</span>
    </label>

    <label class="consent">
      <input type="checkbox" [(ngModel)]="acceptTerms" />
      <span>
        J'accepte les
        <a routerLink="/conditions" target="_blank">conditions d'utilisation</a>
        et j'ai lu la
        <a routerLink="/confidentialite" target="_blank">politique de confidentialité</a>.
      </span>
    </label>

    @if (errorMessage) {
      <div class="error">{{ errorMessage }}</div>
    }

    <button (click)="onRegister()" [disabled]="loading || !adult || !acceptTerms">
      {{ loading ? 'Inscription...' : "S'inscrire" }}
    </button>

    <p class="login-link">
      Déjà un compte ?
      <a routerLink="/login">Se connecter</a>
    </p>

    <app-metana-credit />
  </div>
</div>
