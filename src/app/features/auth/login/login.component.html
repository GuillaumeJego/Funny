<div class="login-container">
  <div class="login-card">
    <div class="brand" aria-hidden="true">funny<b>✦</b></div>
    <p class="tagline">Des sorties, des rencontres, des souvenirs.</p>
    <h1>Connexion</h1>

    @if (successMessage()) {
      <div class="success">{{ successMessage() }}</div>
    }

    <div class="form-group">
      <label for="email">Email</label>
      <input id="email" type="email" [(ngModel)]="email" placeholder="votre@email.com" />
    </div>

    <div class="form-group">
      <label for="password">Mot de passe</label>
      <input id="password" type="password" [(ngModel)]="password" placeholder="••••••••" />
    </div>

    <p class="forgot-link">
      <a routerLink="/mot-de-passe-oublie">Mot de passe oublié ?</a>
    </p>

    @if (errorMessage()) {
      <div class="error">
        {{ errorMessage() }}
      </div>
    }

    <button (click)="onLogin()" [disabled]="loading()">
      {{ loading() ? 'Connexion...' : 'Se connecter' }}
    </button>

    <p class="register-link">
      Pas encore de compte ?
      <a routerLink="/register">S'inscrire</a>
    </p>

    <app-metana-credit />
  </div>
</div>
