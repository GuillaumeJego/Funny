<div class="login-container">
  <div class="login-card">
    <h1>Connexion</h1>

    @if (accountDeleted) {
      <div class="success">Votre compte et toutes vos données ont été supprimés.</div>
    }

    <div class="form-group">
      <label for="email">Email</label>
      <input id="email" type="email" [(ngModel)]="email" placeholder="votre@email.com" />
    </div>

    <div class="form-group">
      <label for="password">Mot de passe</label>
      <input id="password" type="password" [(ngModel)]="password" placeholder="••••••••" />
    </div>

    @if (errorMessage) {
      <div class="error">
        {{ errorMessage }}
      </div>
    }

    <button (click)="onLogin()" [disabled]="loading">
      {{ loading ? 'Connexion...' : 'Se connecter' }}
    </button>

    <p class="register-link">
      Pas encore de compte ?
      <a routerLink="/register">S'inscrire</a>
    </p>

    <app-metana-credit />
  </div>
</div>
