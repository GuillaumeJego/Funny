name: Vérification

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Formatage (Prettier)
        run: npm run format:check
      - name: Build
        run: npm run build
        env:
          # Valeurs publiques, seulement pour que le build passe (aucun appel à Appwrite ici).
          APPWRITE_ENDPOINT: https://appwrite.metanafr.fr/v1
          APPWRITE_PROJECT_ID: verification
      - name: Tests
        run: npm run test:ci
